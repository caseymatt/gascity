name: RC Release

on:
  push:
    tags:
      - "v*.*.*-rc*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "RC tag to create or publish, e.g. v1.2.0-rc1"
        required: true
        type: string
      target_ref:
        description: "Commit SHA, branch, or tag to build when creating the RC tag"
        required: true
        default: "release/v1.2.0"
        type: string

concurrency:
  group: rc-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

permissions: {}

jobs:
  rc-release:
    name: Draft RC release
    if: ${{ github.repository == 'gastownhall/gascity' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout dispatch target
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0

      - name: Checkout pushed tag
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      - name: Resolve RC release target
        id: rc
        env:
          DISPATCH_TAG: ${{ inputs.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$DISPATCH_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi

          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+$ ]]; then
            echo "ERROR: RC tag must match vMAJOR.MINOR.PATCH-rcN, got: $tag" >&2
            exit 1
          fi

          commit="$(git rev-parse 'HEAD^{commit}')"
          git fetch --force --tags origin
          tag_exists=false

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tagged_commit="$(git rev-parse "refs/tags/$tag^{commit}")"
            if [ "$tagged_commit" != "$commit" ]; then
              echo "ERROR: tag $tag points at $tagged_commit, not checked-out commit $commit" >&2
              exit 1
            fi
            tag_exists=true
            echo "Using existing tag $tag at $commit"
          elif [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "ERROR: push event for $tag did not leave a local tag ref" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tag_exists=$tag_exists" >> "$GITHUB_OUTPUT"

      - name: Require exact-SHA RC Gate evidence
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PUBLISH_SHA: ${{ steps.rc.outputs.commit }}
        with:
          script: |
            const publishSha = process.env.PUBLISH_SHA;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo,
              workflow_id: 'rc-gate.yml',
              head_sha: publishSha,
              event: 'workflow_dispatch',
              status: 'success',
              per_page: 100,
            });
            const run = runs.find(candidate =>
              candidate.head_sha === publishSha &&
              candidate.event === 'workflow_dispatch' &&
              candidate.conclusion === 'success'
            );
            if (!run) {
              core.setFailed(
                `No successful workflow_dispatch RC Gate run found for exact publish SHA ${publishSha}. ` +
                'Dispatch RC Gate for this exact commit, wait for it to succeed, then rerun this RC release.'
              );
              return;
            }
            core.info(`Accepted RC Gate run ${run.html_url} for exact publish SHA ${publishSha}.`);
            await core.summary
              .addHeading('RC Gate evidence', 3)
              .addRaw(
                `- Publish SHA: \`${publishSha}\`\n` +
                `- Successful workflow_dispatch RC Gate run: [${run.id}](${run.html_url})\n`
              )
              .write();

      - name: Create RC tag
        if: ${{ github.event_name == 'workflow_dispatch' && steps.rc.outputs.tag_exists == 'false' }}
        env:
          TAG_NAME: ${{ steps.rc.outputs.tag }}
          TARGET_COMMIT: ${{ steps.rc.outputs.commit }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" -m "Release $TAG_NAME" "$TARGET_COMMIT"
          git push origin "refs/tags/$TAG_NAME"
          echo "Created tag $TAG_NAME at $TARGET_COMMIT"

      - name: Reject replace directives in go.mod
        run: |
          if grep -qE '^replace\s' go.mod; then
            echo "ERROR: go.mod contains replace directives; aborting RC release." >&2
            grep -n '^replace' go.mod
            exit 1
          fi

      - name: Run GoReleaser draft prerelease
        uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 # v7
        with:
          version: "~> v2"
          args: release --clean --draft --skip=announce
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.rc.outputs.tag }}

      - name: Summarize RC release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.rc.outputs.tag }}
          TARGET_COMMIT: ${{ steps.rc.outputs.commit }}
        run: |
          set -euo pipefail
          url="$(gh release view "$TAG_NAME" --json url --jq .url)"
          {
            echo "### Draft RC release"
            echo
            echo "- Tag: \`$TAG_NAME\`"
            echo "- Commit: \`$TARGET_COMMIT\`"
            echo "- Release: $url"
            echo
            echo "This workflow creates a draft prerelease only. It does not update the Homebrew tap or mark the release latest."
          } >> "$GITHUB_STEP_SUMMARY"
